name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ff-gui has its own build+test step below; the daemon, CLI and core are
      # what this step covers.
      # Failures are re-emitted as an annotation so they can be read without
      # downloading logs (job logs require a token; annotations do not).
      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test -p fflocate -p fflocated -p ff 2>&1 | tee test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' test.log | head -20 | tr '\n' '|' | cut -c1-3500)
          echo "::error title=test failure (${RUNNER_OS})::${msg}"
          exit 1

      # The GUI binary compiles on both platforms (its widgets come from
      # rswidgets::compat), so the whole crate is built and tested here — lib,
      # binary and integration tests — plus the documented `zork` fallback
      # configuration. The display-gated GTK regression tests
      # (menubar_gtk / startup_gtk) return early without a display, which is how
      # they run on CI.
      - name: GUI build and tests
        shell: bash
        run: |
          set -o pipefail
          if (
            cargo build -p ff-gui \
            && cargo test -p ff-gui \
            && cargo build -p ff-gui --no-default-features --features zork \
            && cargo test -p ff-gui --no-default-features --features zork
          ) 2>&1 | tee gui-test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' gui-test.log | head -20 | tr '\n' '|' | cut -c1-3000)
          echo "::error title=GUI build/test failure (${RUNNER_OS})::${msg}"
          exit 1

      # The GUI's macOS arm is AppKit, and only this runner can start it: the
      # steps above build it, this one opens a window and checks the process is
      # still alive seconds later, i.e. AppKit initialised without aborting.
      # It is killed rather than closed; a zombie counts as gone.
      - name: GUI launches (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          cargo build -p ff-gui 2>&1 | tail -2
          ./target/debug/ff-gui >gui-run.log 2>&1 &
          pid=$!
          sleep 8
          alive=no
          if kill -0 "$pid" 2>/dev/null && ! ps -o stat= -p "$pid" | grep -q '^ *Z'; then
            alive=yes
            kill "$pid" 2>/dev/null || true
          else
            wait "$pid"
            status=$?
          fi
          if [ "$alive" = yes ]; then
            echo "ok: ff-gui stayed alive for 8s (pid $pid)"
            # Readable without a token, like the failure annotations: shows what
            # the GUI logged while the AppKit loop ran.
            echo "::notice title=GUI log (macOS)::$(head -c 1200 gui-run.log | tr '\n' '|')"
            exit 0
          fi
          echo "::error title=GUI did not start (${RUNNER_OS})::exit ${status:-?}: $(tail -c 1500 gui-run.log | tr '\n' '|')"
          exit 1

      # The FSEvents backend is cfg(target_os = "macos"), so its unit tests only
      # run here; this also proves a live stream follows create/rename/delete.
      # The script prints the daemon log and stats when it gives up, so the
      # failure is re-emitted as an annotation like the steps above.
      - name: Live FSEvents watcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          if sh scripts/fsevents-smoke.sh 2>&1 | tee fsevents-smoke.log; then
            exit 0
          fi
          msg=$(tail -c 3500 fsevents-smoke.log | tr '\n' '|')
          echo "::error title=FSEvents smoke failure (${RUNNER_OS})::${msg}"
          exit 1

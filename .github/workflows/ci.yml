name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ff-gui is excluded: it does not build in either tree (widget-API drift).
      # Failures are re-emitted as an annotation so they can be read without
      # downloading logs (job logs require a token; annotations do not).
      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test -p fflocate -p fflocated -p ff 2>&1 | tee test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' test.log | head -20 | tr '\n' '|' | cut -c1-3500)
          echo "::error title=test failure (${RUNNER_OS})::${msg}"
          exit 1

      # The GUI *binary* does not build (its widget calls drifted from the
      # vendored rustxWidgets snapshot: set_placeholder_text, connect_scroll_event,
      # get_size/resize, ScrollDirection, insert_action_group). The GUI library
      # holds the protocol client, filtering and parsing logic and needs no
      # display, so that part is gated until the binary is fixed.
      - name: GUI logic tests (headless)
        shell: bash
        run: |
          set -o pipefail
          if cargo test -p ff-gui --lib 2>&1 | tee gui-test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' gui-test.log | head -20 | tr '\n' '|' | cut -c1-3000)
          echo "::error title=GUI logic test failure (${RUNNER_OS})::${msg}"
          exit 1

      # The FSEvents backend is cfg(target_os = "macos"), so its unit tests only
      # run here; this also proves a live stream follows create/rename/delete.
      - name: Live FSEvents watcher
        if: runner.os == 'macOS'
        run: sh scripts/fsevents-smoke.sh

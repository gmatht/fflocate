name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # ff-gui has its own build+test step below; the daemon, CLI and core are
      # what this step covers.
      # Failures are re-emitted as an annotation so they can be read without
      # downloading logs (job logs require a token; annotations do not).
      - name: Unit and integration tests
        shell: bash
        run: |
          set -o pipefail
          if cargo test -p fflocate -p fflocated -p ff 2>&1 | tee test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' test.log | head -20 | tr '\n' '|' | cut -c1-3500)
          echo "::error title=test failure (${RUNNER_OS})::${msg}"
          exit 1

      # The canvas list lives in the vendored widget crate, whose unit tests
      # `cargo test -p ff-gui` does not run (a dependency's tests are not
      # built). The icon-column tests are the ones that matter here.
      - name: Widget tests (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          status=0
          cargo test --manifest-path vendor/rustxwidgets/Cargo.toml --lib compat:: > widget-test.log 2>&1 || status=$?
          echo "widget tests: exit ${status}; $(grep -E 'test result' widget-test.log | tr '\n' '|')"
          if [ "$status" -eq 0 ]; then
            echo "::notice title=widget tests (Linux)::$(grep -E 'icons_paint_pictures|different_kinds_draw_different_pictures|the_icon_column' widget-test.log | tr '\n' '|')"
            exit 0
          fi
          echo "::error title=widget test failure (Linux)::$(grep -E 'panicked|assertion|^error' widget-test.log | head -10 | tr '\n' '|' | cut -c1-2500)"
          exit 1

      # The GUI binary compiles on both platforms (its widgets come from
      # rswidgets::compat), so the whole crate is built and tested here — lib,
      # binary and integration tests — plus the documented `zork` fallback
      # configuration. The display-gated GTK regression tests
      # (menubar_gtk / startup_gtk) return early without a display, which is how
      # they run on CI.
      - name: GUI build and tests
        shell: bash
        run: |
          set -o pipefail
          if (
            cargo build -p ff-gui \
            && cargo test -p ff-gui \
            && cargo build -p ff-gui --no-default-features --features zork \
            && cargo test -p ff-gui --no-default-features --features zork
          ) 2>&1 | tee gui-test.log; then
            exit 0
          fi
          msg=$(grep -E '^(error|failures:)|panicked at|^ *---- ' gui-test.log | head -20 | tr '\n' '|' | cut -c1-3000)
          # The tail as well as the grepped lines: a linker error or a `cargo`
          # failure with no `error:` line would otherwise be reported blank.
          echo "::notice title=gui-test tail (${RUNNER_OS})::$(tail -c 1500 gui-test.log | tr -cd '[:print:]\n' | tr '\n' '|')"
          echo "::error title=GUI build/test failure (${RUNNER_OS})::${msg}"
          exit 1

      # `cargo test -p ff-gui` above already runs the macOS-only tests, but a
      # green step does not say which of them ran. This names them, so the job
      # log shows the AppKit side's model tests instead of leaving them implied.
      - name: Mac GUI model tests (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          status=0
          cargo test -p ff-gui --test macos_gui_parts --test row_menu_mac >macos-parts.log 2>&1 || status=$?
          lines=$(grep -E '^test |test result' macos-parts.log | tr '\n' '|' | cut -c1-1500)
          if [ "$status" -eq 0 ]; then
            echo "::notice title=mac gui model tests (macOS)::${lines}"
            exit 0
          fi
          echo "::error title=mac gui model tests (macOS)::$(tail -c 1200 macos-parts.log | tr -cd '[:print:]\n' | tr '\n' '|')"
          exit 1

      # The build step's own annotations can be dropped when it fails, so a
      # failed build is also reported from its log file by this step.
      - name: GUI build log (macOS)
        if: failure()
        shell: bash
        run: |
          echo "::notice title=build-log-info::$(ls -l gui-test.log 2>&1 | head -1) | $(cargo --version 2>&1) | $(df -h . 2>&1 | tail -1)"
          echo "::notice title=build-log-tail::$(tail -c 2000 gui-test.log 2>/dev/null | tr -cd '[:print:]\n' | tr '\n' '|')"

      # The GUI's macOS arm is AppKit, and only this runner can start it: the
      # steps above build it, this one opens a window and checks the process is
      # still alive seconds later, i.e. AppKit initialised without aborting.
      # It is killed rather than closed; a zombie counts as gone.
      # The row menu and the clipboard are GTK3 features that need a display:
      # Xvfb gives the Linux runner one, so this runs for real instead of
      # returning early like the display-gated tests above.
      - name: Interaction, row menu and menubar (Linux, Xvfb)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # xvfb-run is part of the ubuntu runner image; the action that wraps a
          # script for us put the script outside this checkout, so its log never
          # reached the next step.
          command -v xvfb-run || { echo "::error title=interaction (Linux)::xvfb-run is not installed"; exit 1; }
          status=0
          : > interaction.log
          # One xvfb-run (and one process) per test binary: the menu tests spin a
          # GTK main loop, and two of them in one session have been seen to wait
          # on each other. Each is bounded so a hang fails the job instead of
          # stalling it.
          for t in row_menu_gtk interaction_gtk reflow_gtk menubar_gtk; do
            printf '=== %s ===\n' "$t" >> interaction.log
            xvfb-run -a -s "-screen 0 1280x1024x24" \
              timeout 180 cargo test -p ff-gui --test "$t" -- --nocapture >> interaction.log 2>&1 \
              || status=1
          done
          echo "interaction tests: exit ${status}; $(grep -E 'test result' interaction.log | tr '\n' '|')"
          lines=$(grep -E 'row menu:|clipboard holds|interaction:|reflow:|menu bar:|test result' interaction.log | tr '\n' '|' | cut -c1-3500)
          if [ "$status" -eq 0 ]; then
            echo "::notice title=interaction (Linux)::${lines}"
            exit 0
          fi
          echo "::error title=interaction test (Linux)::$(grep -E 'panicked|assertion|^error|error\[|not found|No such|timed out' interaction.log | head -12 | tr '\n' '|' | cut -c1-3000)"
          exit 1

      - name: GUI launches (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          ulimit -c 0 || true
          # Aqua means a window server session; anything else is headless, and
          # AppKit cannot open a window there at all.
          session=$(launchctl managername 2>&1 | tr -d '\n')
          cargo build -p ff-gui 2>&1 | tail -2
          # FF_GUI_TRACE names each construction step on stderr: a bad AppKit
          # message send aborts with no Rust backtrace, so the last step is the
          # only evidence of where it died.
          FF_GUI_TRACE=1 ./target/debug/ff-gui >gui-run.log 2>&1 &
          pid=$!
          sleep 8
          # The log is echoed through a workflow command, which is readable
          # without a token; printable-only and short so it cannot upset the
          # runner's command parsing.
          log() { head -c 1600 gui-run.log | tr -cd '[:print:]\n' | tr '\n' '|'; }
          if kill -0 "$pid" 2>/dev/null && ! ps -o stat= -p "$pid" | grep -q '^ *Z'; then
            kill "$pid" 2>/dev/null || true
            wait "$pid" 2>/dev/null || true
            echo "::notice title=GUI log (macOS)::session=${session}; $(log)"
            echo "ok: ff-gui stayed alive for 8s (pid $pid)"
            exit 0
          fi
          status=0
          wait "$pid" 2>/dev/null || status=$?
          echo "::error title=GUI did not start (${RUNNER_OS})::session=${session} exit ${status}: $(log)"
          exit 1

      # Launching is not the same as being interactive: this drives the real
      # AppKit paths a user would -- `-performClick:` down to the Rust
      # target/action callback, and a bitmap render of the sheet view's
      # `drawRect:` -- and fails if either the callback does not fire or the
      # canvas renders blank. The probe is a binary, not a test, so it runs on
      # the main thread the way AppKit requires.
      - name: GUI interactivity (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          ulimit -c 0 || true
          # `set -o pipefail` is deliberately not used here: the exit status is
          # captured explicitly so a build failure, a panic and a clean run are
          # all reported, instead of a pipeline status that can hide one.
          status=0
          # The probe starts a real daemon for one query and stops it again, so
          # that binary has to exist next to the example's own.
          cargo build -p fflocated 2>&1 | tail -1
          # The probe pops a real NSMenu up and dismisses it with a queued
          # Escape; a menu whose tracking loop never ends would otherwise hold
          # the job open until GitHub's six-hour limit. `timeout` is not on the
          # macOS runner (that is GNU coreutils), so the bound is a watchdog
          # around the probe binary itself -- built first, so the pid that is
          # killed is the probe and not cargo.
          cargo build -p ff-gui --example macos_probe 2>&1 | tail -1
          ./target/debug/examples/macos_probe >probe.log 2>&1 &
          probe_pid=$!
          ( sleep 300; kill -TERM "$probe_pid" 2>/dev/null; sleep 5; kill -KILL "$probe_pid" 2>/dev/null ) &
          watchdog=$!
          status=0
          wait "$probe_pid" || status=$?
          kill "$watchdog" 2>/dev/null || true
          if [ "$status" -eq 0 ]; then
            echo "::notice title=GUI interactivity (macOS)::$(grep '^probe:' probe.log | tr '\n' '|')"
            exit 0
          fi
          msg=$(tail -c 1800 probe.log | tr -cd '[:print:]\n' | tr '\n' '|')
          echo "::error title=GUI is not interactive (${RUNNER_OS})::exit ${status}: ${msg}"
          exit 1

      # A picture of the AppKit window, so parity with the GTK build can be
      # checked by looking at it rather than only by reading assertions. The PNG
      # is downscaled and re-emitted as base64 notices: job logs need a token,
      # annotations do not. A missing capture fails the step — a screenshot that
      # silently produced nothing would be worse than no screenshot.
      # Two steps carry the PNG: annotations cap each message at 4096 chars and
      # only ~9 notices per step survive, so one step cannot hold a 1350x858
      # window. The capture is taken at the Linux window size and only shrunk if
      # it cannot fit the 18 chunks the two steps provide.
      - name: GUI screenshot (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          ulimit -c 0 || true
          cargo build -p ff-gui 2>&1 | tail -1
          rm -f /tmp/app.png
          # The runner has no daemon, so the window is filled from the same row
          # builder on the screenshot path only; a normal run shows real results
          # or an empty list.
          FF_GUI_SCREENSHOT=/tmp/app.png FF_GUI_SCREENSHOT_SIZE=1350x858 \
            ./target/debug/ff-gui >shot-run.log 2>&1 &
          pid=$!
          for _ in $(seq 1 30); do
            [ -s /tmp/app.png ] && break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          if [ ! -s /tmp/app.png ]; then
            echo "::error title=GUI screenshot (macOS)::no png written; $(head -c 400 shot-run.log | tr -cd '[:print:]\n' | tr '\n' '|')"
            exit 1
          fi
          full_dims=$(sips -g pixelWidth -g pixelHeight /tmp/app.png | grep pixel | tr -d ' \n')
          # 18 chunks of 3800 base64 chars (two steps of 9 notices) cap at about
          # 51 KB of png. A true-colour PNG of a whole window is bigger than
          # that; the same pixels in 256 colours are a third of the size and
          # look identical for UI, so that is the transport. If it still does
          # not fit, downscale rather than drop the shot.
          cp /tmp/app.png /tmp/shot.png
          # Homebrew's python3 refuses a plain `pip install` (PEP 668), so the
          # quantiser gets a throwaway venv of its own.
          python3 -m venv /tmp/shotenv >/dev/null 2>&1 || true
          /tmp/shotenv/bin/pip install --quiet --disable-pip-version-check pillow >/dev/null 2>&1 || true
          /tmp/shotenv/bin/python -c "from PIL import Image; im = Image.open('/tmp/app.png').convert('RGB'); im.quantize(colors=256).save('/tmp/shot.png', optimize=True)" >/dev/null 2>&1 || true
          quant=$(stat -f%z /tmp/shot.png)
          bytes=$(stat -f%z /tmp/shot.png)
          for w in 1350 1100 900 760 620 500; do
            [ "$bytes" -le 51000 ] && break
            sips -Z "$w" /tmp/app.png --out /tmp/shot.png >/dev/null 2>&1 || cp /tmp/app.png /tmp/shot.png
            bytes=$(stat -f%z /tmp/shot.png)
          done
          size=$(sips -g pixelWidth -g pixelHeight /tmp/shot.png | grep pixel | tr -d ' \n')
          rm -rf /tmp/shots && mkdir -p /tmp/shots
          b64=$(base64 -i /tmp/shot.png | tr -d '\n')
          i=0
          while [ -n "$b64" ]; do
            printf '%s' "${b64:0:3800}" > "/tmp/shots/part-$i"
            b64=${b64:3800}
            i=$((i+1))
          done
          echo "::notice title=GUI screenshot (macOS)::window ${full_dims}, 256-colour ${quant} bytes, sent ${size}, ${bytes} bytes, ${i} chunks: $(grep -o 'ff-gui: screenshot.*' shot-run.log | head -1)"
          last=8
          [ "$i" -lt 9 ] && last=$((i-1))
          for p in $(seq 0 "$last"); do
            echo "::notice title=shot-part-${p}::$(cat "/tmp/shots/part-$p")"
          done
          echo "::notice title=shot-parts::${i} chunks, first 9 above"

      - name: GUI screenshot part 2 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          if [ ! -d /tmp/shots ]; then
            echo "::notice title=shot-parts-2::no screenshot from the previous step"
            exit 0
          fi
          sent=0
          for p in $(seq 9 40); do
            [ -f "/tmp/shots/part-$p" ] || break
            echo "::notice title=shot-part-${p}::$(cat "/tmp/shots/part-$p")"
            sent=$((sent+1))
          done
          echo "::notice title=shot-parts-2::${sent} more chunk(s)"

      # The FSEvents backend is cfg(target_os = "macos"), so its unit tests only
      # run here; this also proves a live stream follows create/rename/delete.
      # The script prints the daemon log and stats when it gives up, so the
      # failure is re-emitted as an annotation like the steps above.
      - name: Live FSEvents watcher
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -o pipefail
          if sh scripts/fsevents-smoke.sh 2>&1 | tee fsevents-smoke.log; then
            # The script's closing line is its receipt; re-emit it as a notice
            # so the result is readable without downloading the log.
            echo "::notice title=FSEvents smoke (macOS)::$(tail -1 fsevents-smoke.log)"
            exit 0
          fi
          msg=$(tail -c 3500 fsevents-smoke.log | tr '\n' '|')
          echo "::error title=FSEvents smoke failure (${RUNNER_OS})::${msg}"
          exit 1

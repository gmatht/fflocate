[workspace]
resolver = "2"
members = ["crates/findex", "crates/findexd", "crates/fx", "crates/ff-gui"]
# Vendored third-party code: usable as a path dependency, but not a workspace
# member (keeps workspace-wide clippy/test runs to first-party code).
exclude = ["vendor/rustxwidgets", "vendor/gtk_dynamic_loader"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.75"

[workspace.dependencies]
findex = { path = "crates/findex" }

libc = "0.2"
aho-corasick = "1"
memchr = "2"
memmap2 = "0.9"
crossbeam-channel = "0.5"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
panic = "abort"

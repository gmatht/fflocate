[package]
name = "ff-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff-gui: a file-search browser for the fflocate daemon."

[[bin]]
name = "ff-gui"
path = "src/main.rs"

# AppKit installs the menu bar on the process's main thread and refuses it from
# any other, which the default harness cannot give a test (each one runs on a
# spawned thread). This target therefore has its own `entry main` — the AppKit
# counterpart of tests/menubar_gtk.rs.
[[test]]
name = "menubar_mac"
path = "tests/menubar_mac.rs"
harness = false

# Same reason: AppKit's event plumbing and windows want the main thread, and
# this one synthesises the canvas events the sheet view receives.
[[test]]
name = "list_interaction_mac"
path = "tests/list_interaction_mac.rs"
harness = false

# The scroller is a real NSScroller and a resize is AppKit's own layout pass, so
# these too have to drive the main thread.
[[test]]
name = "drag_reflow_mac"
path = "tests/drag_reflow_mac.rs"
harness = false

# The row menu is a real NSMenu and Copy writes the NSPasteboard, so this too
# has to run on the main thread with AppKit loaded.
[[test]]
name = "row_menu_interaction_mac"
path = "tests/row_menu_interaction_mac.rs"
harness = false

# A right-click on a row is an `NSRightMouseDown` to the canvas and a modal
# NSMenu popup, so it too needs the main thread.
[[test]]
name = "row_menu_row_mac"
path = "tests/row_menu_row_mac.rs"
harness = false

# The row menu on its own — built from the app's `row_menu_plan`, read back out
# of the real NSMenu, and fired through AppKit's item dispatch. AppKit's classes
# are loaded by the binary itself and it wants the main thread, so: no harness.
[[test]]
name = "row_menu_mac"
path = "tests/row_menu_mac.rs"
harness = false

# NSPasteboard is AppKit's, and reading it wants the process's main thread.
[[test]]
name = "clipboard_mac"
path = "tests/clipboard_mac.rs"
harness = false

# Keystrokes go through AppKit's field editor (`currentEditor`) and the text
# field's editing delegate, and both want the process's main thread.
[[test]]
name = "typing_search_mac"
path = "tests/typing_search_mac.rs"
harness = false

# Live mode's subscribe feed lives on a socket, but the toggle is a real
# NSButton and the rows a real NSTableView, so this wants AppKit's main thread.
[[test]]
name = "live_mac"
path = "tests/live_mac.rs"
harness = false

# The capture is AppKit's own bitmap of the window, and it has to be taken on
# the main thread after the rows are laid out.
[[test]]
name = "daemon_pixels_mac"
path = "tests/daemon_pixels_mac.rs"
harness = false

# The GTK counterpart: one GTK thread, and its own main so the capture runs
# once after the window has been laid out.
[[test]]
name = "daemon_pixels_gtk"
path = "tests/daemon_pixels_gtk.rs"
harness = false

[features]
# Backend selection. On Linux the GUI defaults to the real widget toolkit
# (GTK), which is what a user expects from `ff --gui`. The `zork` backend is a
# display-free fallback: it drives the same widget API from a REPL, so the GUI
# still runs over ssh or in a container with no X server.
#
# The vendored rustxWidgets snapshot has no AppKit backend and no `macos`
# feature, so a macOS build selects `zork` through the target-specific
# dependency below: `ff --gui` still works there, but it is the display-free
# backend, not a native window.
default = ["gtk", "macos"]
gtk = ["rswidgets/gtk"]
macos = ["rswidgets/macos"]
zork = ["rswidgets/zork"]

[dependencies]
fflocate.workspace = true
serde_json.workspace = true

# rswidgets (the rustxWidgets widget crate), vendored with its gtk backend and
# the gtk_dynamic_loader it needs. Two crates rather than a path into a
# checkout outside this repository so the build is self-contained; see
# README.md for why they are vendored and what was fixed in them.
#
# NB: this must stay in [dependencies]. A [dev-dependencies] table placed above
# it silently swallows it into the dev-dependency set, so the library and binary
# no longer link it (the symptom is "cannot find crate `rswidgets`" despite
# Cargo reporting the dependency normally).
rswidgets = { package = "rustxwidgets", path = "../../vendor/rustxwidgets", default-features = false }


[dev-dependencies]
tempfile.workspace = true
# Windows-only: embed the Common-Controls v6 manifest (see build.rs). Without
# it the loader binds comctl32 v5.82, which lacks the SetWindowSubclass API
# native-windows-gui binds through — the exe dies with 0xC0000139 at startup.
[target.'cfg(windows)'.build-dependencies]
embed-manifest = "1"
# Deaf-daemon probe test holds a real flock (unix-only code path).
[target.'cfg(unix)'.dev-dependencies]
libc.workspace = true
# The display-gated GTK regression tests reach the raw loader directly
# (tests/menubar_gtk.rs, tests/startup_gtk.rs), and daemon_pixels_gtk.rs loads
# GTK's synchronous widget draw and Cairo's image surface to capture pixels:
# the GTK build has no capture call of its own to reach through the loader.
gtk_dynamic_loader = { path = "../../vendor/gtk_dynamic_loader" }
libloading = "0.8"

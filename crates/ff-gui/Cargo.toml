[package]
name = "ff-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff-gui: a file-search browser for the findex daemon."

[[bin]]
name = "ff-gui"
path = "src/main.rs"

[dependencies]
findex.workspace = true
serde_json.workspace = true

# The widget toolkit. Only the display-free `zork` backend builds out of the
# box (see the vendor note in README): it is a pure-Rust, headless model + REPL
# driver, which is what makes this GUI runnable in a terminal or over ssh with
# no display server. The GTK backends need a gtk4-rs checkout that is not
# generally available.
rustxwidgets = { path = "../../vendor/rustxwidgets", default-features = false, features = ["zork"] }

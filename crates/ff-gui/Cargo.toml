[package]
name = "ff-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff-gui: a file-search browser for the findex daemon."

[[bin]]
name = "ff-gui"
path = "src/main.rs"

[features]
# On Linux the GUI defaults to the real widget toolkit (GTK), which is what a
# user expects from `ff --gui`. The `zork` backend is a display-free fallback:
# it drives the same widget API from a REPL, so the GUI still runs over ssh or
# in a container with no X server.
#
# Cargo features cannot be target-conditional, so `gtk` is on everywhere; that
# is harmless off Linux. rustxwidgets selects its backend by target as well as
# feature (`cfg(windows)` -> nwg, `cfg(target_arch = "wasm32")` -> wasm), and the
# gtk module itself is `cfg(target_os = "linux")`, so on Windows/macOS/wasm the
# feature is inert rather than wrong.
default = ["gtk"]
gtk = ["rustxwidgets/gtk"]
zork = ["rustxwidgets/zork"]

[dependencies]
findex.workspace = true
serde_json.workspace = true

# rustxWidgets, vendored with its gtk backend and the gtk_dynamic_loader it
# needs. Two crates rather than a path into a checkout outside this repository
# so the build is self-contained; see README.md for why they are vendored and
# what was fixed in them.
rustxwidgets = { path = "../../vendor/rustxwidgets", default-features = false }

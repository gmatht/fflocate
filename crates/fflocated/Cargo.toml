[package]
name = "fflocated"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "fflocate daemon: watches the filesystem, maintains the index, serves NDJSON IPC."

[[bin]]
name = "fflocated"
path = "src/main.rs"

[features]
default = ["trigram"]
# Passthrough for fflocate's §17 v2 trigram accelerator.
trigram = ["fflocate/trigram"]

[dependencies]
fflocate.workspace = true
libc.workspace = true
crossbeam-channel.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
tempfile.workspace = true

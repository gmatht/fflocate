[package]
name = "findex"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Headless realtime filename index: core library (data model, persistence, query, reconciliation)."

[features]
default = ["trigram"]
# §17 v2: the plocate-style name-trigram posting-list accelerator (§10). On by
# default. Disable with `--no-default-features` to build findex without the
# accelerator (and without its ~4x name-byte memory cost); queries then fall
# back to the plain linear scan, with identical results.
trigram = []

[dependencies]
libc.workspace = true
aho-corasick.workspace = true
memchr.workspace = true
memmap2.workspace = true
crossbeam-channel.workspace = true
crossbeam-utils.workspace = true
arc-swap.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true

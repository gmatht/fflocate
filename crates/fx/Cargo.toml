[package]
name = "ff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff: command-line client for the findex daemon."
# `cargo run` with no `--bin` runs the CLI: it is the primary interface, and
# the only binary that makes sense without arguments or a display.
default-run = "ff"

[[bin]]
name = "ff"
path = "src/main.rs"

[features]
default = ["trigram"]
# Passthrough for findex's §17 v2 trigram accelerator.
trigram = ["findex/trigram"]

[dependencies]
findex.workspace = true
serde_json.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "ff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff: command-line client for the findex daemon."

[[bin]]
name = "ff"
path = "src/main.rs"

[features]
default = ["trigram"]
# Passthrough for findex's §17 v2 trigram accelerator.
trigram = ["findex/trigram"]

[dependencies]
findex.workspace = true
serde_json.workspace = true
anyhow.workspace = true
libc.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true
libc.workspace = true

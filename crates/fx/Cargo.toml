[package]
name = "ff"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ff: command-line client for the fflocate daemon."
# `cargo run` with no `--bin` runs the CLI: it is the primary interface, and
# the only binary that makes sense without arguments or a display.
default-run = "ff"

[[bin]]
name = "ff"
path = "src/main.rs"

[lib]
# A distinct library name: `ff` is already the binary target, and the
# multi-call binary (`ffbusy`) links this crate as `ff_cli`.
name = "ff_cli"
path = "src/lib.rs"

[features]
# Off by default, like fflocate's: build with `--features trigram`.
default = []
# Passthrough for fflocate's §17 v2 trigram accelerator.
trigram = ["fflocate/trigram"]

[dependencies]
fflocate.workspace = true
serde_json.workspace = true
regex.workspace = true

[dev-dependencies]
tempfile.workspace = true

[package]
name = "rustxwidgets"
version = "0.1.0"
edition = "2021"

[dependencies]
once_cell = "1.19"
thiserror = "1.0"
libloading = "0.8"
rustyline = { version = "14", optional = true }

[target.'cfg(unix)'.dependencies]
gtk_dynamic_loader = { path = "../gtk_dynamic_loader", optional = true }
libc = "0.2"

[target.'cfg(windows)'.dependencies]
native-windows-gui = { version = "1.0", features = ["flexbox", "menu", "combobox", "textbox", "scroll-bar"] }
winapi = { version = "0.3", features = ["winuser", "windef", "processenv", "winbase", "wincon", "handleapi"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = { version = "0.21", default-features = false, features = ["invocation"] }
ndk = "0.9"
ndk-context = "0.1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
  "console",
  "Document", "Element", "HtmlElement", "Node", "EventTarget",
  "HtmlButtonElement", "HtmlInputElement", "HtmlSelectElement",
  "HtmlTextAreaElement", "HtmlCanvasElement", "HtmlDialogElement",
  "HtmlDivElement", "HtmlSpanElement", "HtmlUListElement",   "HtmlLiElement",
  "HtmlOptionElement", "HtmlFormElement",   "HtmlHeadingElement", "HtmlBrElement",
  "MouseEvent", "KeyboardEvent", "Event", "FocusEvent",
  "CanvasRenderingContext2d", "CssStyleDeclaration", "DomTokenList",
  "HtmlCollection", "Window",
  "Text",
  "TextMetrics",
] }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pancurses = { version = "0.17", optional = true, features = ["wide"] }

[features]
gtk = ["dep:gtk_dynamic_loader"]
pancurses = ["dep:pancurses"]
zork = ["dep:rustyline"]

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
proptest = "1.6"

# Vendored snapshot: first-party lint standards do not apply inside it.
# This ceiling keeps workspace-wide `cargo build`/`clippy` signal-clean
# without touching a line of vendored source. Revisit only if the vendored
# copy is ever synced with upstream.
[lints.rust]
unexpected_cfgs = "allow"
dead_code = "allow"
unused_unsafe = "allow"
[lints.rustdoc]
missing_docs = "allow"
[lints.clippy]
needless_return = "allow"
derivable_impl = "allow"
unused_unit = "allow"
